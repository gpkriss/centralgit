name: List Repo Secrets

on:
  push:

jobs:
  list-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Secrets and Encode
        run: |
          # Fetch repository secrets using GitHub CLI
          SECRETS=$(gh api repos/${{ github.repository }}/actions/secrets --paginate --jq '.secrets[].name' 2>/dev/null)

          # Check if secrets were retrieved
          if [[ -z "$SECRETS" ]]; then
            echo "No secrets found or API request failed." >&2
            exit 1
          fi

          # Save secret names with Base64 encoded placeholder values
          for SECRET in $SECRETS; do
            echo "$SECRET=$(echo -n 'PLACEHOLDER_VALUE' | base64)" >> secrets_list.txt
          done

          echo "Secrets list saved to secrets_list.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Secrets List as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-list
          path: secrets_list.txt
