name: Auto PR Creation and Status Check

on:
  workflow_dispatch:

jobs:
  modify-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: kamal  # Working on "kamal" branch

      - name: Modify file22
        run: |
          echo "hello world" >> file22
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add file22
          git commit -m "Added hello world to file22"
          git push origin kamal

  create-pr:
    needs: modify-file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        id: create_pr
        run: |
          PR_URL=$(gh pr create --base main --head kamal --title "Auto PR: Update file22" --body "This PR adds a 'hello world' line to file22.")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-pr-status:
    needs: create-pr
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Status
        run: |
          PR_NUMBER=$(gh pr list --state open --head kamal --json number --jq '.[0].number')
          if [[ -z "$PR_NUMBER" ]]; then
            echo "❌ No PR found, process failed."
            exit 1
          fi

          PR_STATE=$(gh pr view $PR_NUMBER --json state --jq '.state')

          if [[ "$PR_STATE" == "OPEN" ]]; then
            echo "✅ PR Status: Succeeded"
          else
            echo "❌ PR Status: Failed"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

