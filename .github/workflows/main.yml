name: Decode Base64 Secret

on:
  workflow_dispatch:

jobs:
  decode-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and show base64 secret
        run: |
          echo "Decoding secret..."
          echo "${{ secrets.GH_TOKEN }}" | base64 --decode > decoded.txt
          echo "Decoded secret:"
          cat decoded.txt

