name: List Repository Secrets

on:
  push:
  workflow_dispatch:

jobs:
  list-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kamal

      - name: Get all secrets with GitHub API and pagination
        run: |
          page=1
          per_page=30  # GitHub API default page size
          total_count=0
          
          while : ; do
            response=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN3 }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets?per_page=$per_page&page=$page")
            
            secrets=$(echo "$response" | jq -r '.secrets[]?.name')
            count=$(echo "$secrets" | wc -l)
            
            if [ "$count" -eq 0 ]; then
              break
            fi
            
            echo "Secrets on page $page:"  
            echo "$secrets"
            
            total_count=$((total_count + count))
            page=$((page + 1))
          done
          
          echo "Total Secrets: $total_count"

