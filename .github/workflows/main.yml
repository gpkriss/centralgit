name: "Fetch Repository Secrets"

on:
  push:
    branches:
      - kamal
  workflow_dispatch:

jobs:
  fetch-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Store Secrets in JSON File
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_TOKEN3: ${{ secrets.GH_TOKEN3 }}
        run: |
          echo "Storing secrets in secrets.json..."
          echo '{' > secrets.json
          
          [[ -n "$AWS_ACCESS_KEY_ID" ]] && echo '"AWS_ACCESS_KEY_ID": "'"$AWS_ACCESS_KEY_ID"'",' >> secrets.json
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] && echo '"AWS_SECRET_ACCESS_KEY": "'"$AWS_SECRET_ACCESS_KEY"'",' >> secrets.json
          [[ -n "$GH_TOKEN3" ]] && echo '"GH_TOKEN3": "'"$GH_TOKEN3"'"' >> secrets.json

          sed -i '$ s/,$//' secrets.json  # Remove trailing comma
          echo '}' >> secrets.json

          echo "Secrets stored successfully in secrets.json!"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change as needed

      - name: Upload Secrets to AWS Secrets Manager
        run: python3 scripts/store_secrets_individually.py


