name: "Fetch and Copy Repository Secrets"

on:
  push:
    branches:
      - kamal
  workflow_dispatch:

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Run Python script to copy secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN3 }}
          REPO_OWNER: "your_target_repo_owner"
          REPO_NAME: "your_target_repo_name"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python scripts/store_secret.py

