
name: Manual Secret Encoding

on: [push]

jobs:
  encode-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve and Encode Secret
        run: |
          echo -n "${{ secrets.SECRE1_1 }}" | base64
          
      - name: Store Encoded Secret in ENV
        run: |
          echo "ENCODED_SECRET=$(echo -n '${{ secrets.SECRE1_1  }}' | base64)" >> secret.txt
          
      - name: Print Encoded Secret
        run: echo "$ENCODED_SECRET"



