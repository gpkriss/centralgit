name: Decode Base64 Secret

on:
  push

permissions:
  contents: read
  actions: read

jobs:
  decode-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and print GH_TOKEN
        shell: bash
        run: |
          echo "Decoding GH_TOKEN..."
          echo "${{ secrets.GH_TOKEN }}" | base64 --decode || echo "❌ Invalid base64"

