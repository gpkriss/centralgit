name: Sync Secrets to AWS Secrets Manager

on:
  push:

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3  # Ensures script is available

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip3 install boto3 requests

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Export All Secrets as Environment Variables
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Exporting secrets..."
          echo "SECRETS=$(gh api repos/${{ github.repository }}/actions/secrets --jq '.secrets[].name')" >> $GITHUB_ENV
          for secret in $SECRETS; do
            echo "$secret=${{ secrets[secret] }}" >> $GITHUB_ENV
          done

      - name: Run Python Script to Sync Secrets
        run: python3 scripts/sync_secrets.py


      - name: Run Python Script to Sync Secrets
        run: python3 scripts/sync_secrets.py

