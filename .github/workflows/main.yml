name: "Fetch Repository Secrets"

on:
  push:
    branches:
      - kamal
  workflow_dispatch:

jobs:
  fetch-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository secrets via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching repository secrets from GitHub API..."

          PAGE=1
          PER_PAGE=100
          TOTAL_SECRETS=0
          SECRET_LIST=""

          while true; do
            # Fetch secrets using GitHub API with pagination
            RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github+json" \
                            "https://api.github.com/repos/$REPO/actions/secrets?per_page=$PER_PAGE&page=$PAGE")

            # Extract secret names
            SECRETS=$(echo "$RESPONSE" | jq -r '.secrets[].name' 2>/dev/null)
            COUNT=$(echo "$SECRETS" | wc -l)

            # Break loop if no more secrets
            if [[ -z "$SECRETS" || "$COUNT" -eq 0 ]]; then
              break
            fi

            # Append to list
            SECRET_LIST+="$SECRETS"$'\n'
            TOTAL_SECRETS=$((TOTAL_SECRETS + COUNT))

            PAGE=$((PAGE + 1))
          done

          echo "--------------------------------"
          echo "Total Secrets Found: $TOTAL_SECRETS"
          echo "--------------------------------"
          echo "$SECRET_LIST"
