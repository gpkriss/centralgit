name: "Fetch Repository Secrets"

on:
  push:
    branches:
      - kamal
  workflow_dispatch:

jobs:
  fetch-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch repository secrets via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN3 }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching repository secrets from GitHub API..."
          PAGE=1
          PER_PAGE=100
          mkdir -p secrets  # Create directory to store secrets

          while true; do
            RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github+json" \
                            "https://api.github.com/repos/$REPO/actions/secrets?per_page=$PER_PAGE&page=$PAGE")
            
            SECRETS=$(echo "$RESPONSE" | jq -r '.secrets[].name' 2>/dev/null)
            
            if [[ -z "$SECRETS" ]]; then
              break
            fi

            for SECRET in $SECRETS; do
              VALUE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                           -H "Accept: application/vnd.github+json" \
                           "https://api.github.com/repos/$REPO/actions/secrets/$SECRET" | jq -r '.encrypted_value')
              
              if [[ -n "$VALUE" && "$VALUE" != "null" ]]; then
                echo "$VALUE" > "secrets/$SECRET.txt"
              fi
            done

            PAGE=$((PAGE + 1))
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change as needed

      - name: Upload secrets to AWS Secrets Manager
        run: python3 scripts/store_secret.py


