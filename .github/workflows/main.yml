name: Retrieve Secret in Base64

on:
  push:

jobs:
  encode-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve and Encode Secret in Base64
        run: |
          echo "ENCODED_SECRET=$(echo -n '${{ secrets.MY_SECRET }}' | base64)" >> $GITHUB_ENV

      - name: Print Encoded Secret (Masked by GitHub)
        run: echo display secret ${ENCODED_SECRET}"


