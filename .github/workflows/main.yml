name: Fetch and Move Repository Secrets

on:
  push:
    branches:
      - kamal  # Runs only when code is pushed to the 'kamal' branch
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: read
  id-token: write

jobs:
  fetch-and-move-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip install boto3

      - name: Fetch all secrets with pagination
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN3 }}
          REPO_OWNER: "gpkriss"
          REPO_NAME: "centralgit"
        run: |
          PAGE=1
          SECRETS_FILE=secrets.txt
          echo "" > $SECRETS_FILE
          
          while true; do
            RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                              -H "Accept: application/vnd.github.v3+json" \
                              "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/actions/secrets?per_page=100&page=$PAGE")
            
            SECRET_NAMES=$(echo "$RESPONSE" | jq -r '.secrets[].name')
            
            if [ -z "$SECRET_NAMES" ]; then
              break
            fi

            echo "$SECRET_NAMES" >> $SECRETS_FILE
            ((PAGE++))
          done

          echo "Total secrets fetched: $(wc -l < $SECRETS_FILE)"

      - name: Call Python script to move secrets to AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
        run: |
          python3 store_secret.py
