name: "Fetch Repository Secrets"

on:
  push:
    branches:
      - kamal
  workflow_dispatch:

jobs:
  fetch-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract and Save Secrets
        run: |
          echo "Extracting repository secrets..."

          mkdir -p secrets  # Directory to store secrets

          # List all secrets manually
          SECRET_NAMES=("AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "GH_TOKEN3")  # Add more secrets here

          for SECRET in "${SECRET_NAMES[@]}"; do
            VALUE="${{ secrets[SECRET] }}"
            if [[ -n "$VALUE" ]]; then
              echo "$VALUE" > "secrets/$SECRET.txt"
            fi
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change if needed

      - name: Upload secrets to AWS Secrets Manager
        run: python3 scripts/store_secrets_individually.py


