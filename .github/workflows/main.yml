name: List GitHub Secrets

on: [push]

jobs:
  list-secrets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: List Secrets
      id: list-secrets
      run: |
        PAGE=1
        while : ; do
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets?per_page=100&page=$PAGE")
          SECRETS=$(echo $RESPONSE | jq '.secrets | length')
          if [ "$SECRETS" -eq "0" ]; then
            break
          fi
          echo $RESPONSE | jq '.secrets[] | .name'
          PAGE=$((PAGE + 1))
        done

    - name: Show secrets
      run: echo "Secrets have been listed!"
