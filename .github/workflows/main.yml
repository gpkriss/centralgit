name: Sync TEST_TOKEN to AWS Secrets Manager

on:
  push:

jobs:
  sync-test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip3 install boto3

      - name: Verify AWS CLI Installation
        run: aws --version

      - name: Checkout Repository
        uses: actions/checkout@v3  # Ensures the script is available

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Fetch repository secrets and check for TEST_TOKEN
        env:
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}  # Retrieve actual secret value
        run: |
          echo "Checking for TEST_TOKEN..."
          if [[ -z "$TEST_TOKEN" ]]; then
            echo "TEST_TOKEN not found or empty in GitHub secrets."
            exit 1
          else
            echo "TEST_TOKEN found! Storing in AWS..."
            echo "$TEST_TOKEN" > secret_value.txt
          fi

      - name: Run Python Script to Store Secret in AWS
        run: python3 scripts/store_secret.py  # Running the script
