name: Manual Secret Encoding

on: [push]

jobs:
  encode-secret:
    runs-on: ubuntu-latest
    steps:
          
      - name: Store Encoded Secret in ENV
        run: |
          echo "ENCODED_SECRET=$(echo -n '${{ secrets.SECRE1_1  }}' | base64)" >> $GITHUB_ENV
          echo "$ENCODED_SECRET"

       

          




