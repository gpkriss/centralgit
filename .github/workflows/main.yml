name: List Repository Secrets

on:
   push:  # Manually trigger this workflow

jobs:
  list-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository secrets with pagination
        run: |
          REPO=${{ github.repository }}  # Get the repo (owner/repo)
          TOKEN=${{ secrets.GH_TOKEN }}    # GitHub PAT stored as a secret
          PER_PAGE=30                    # Number of secrets per page
          PAGE=1                          # Start with page 1

          echo "Fetching repository secrets for $REPO"

          while true; do
            RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" \
                           -H "Authorization: token $TOKEN" \
                           "https://api.github.com/repos/$REPO/actions/secrets?per_page=$PER_PAGE&page=$PAGE")

            SECRETS=$(echo "$RESPONSE" | jq -r '.secrets[]?.name')
            NEXT_PAGE=$(echo "$RESPONSE" | jq -r 'if .secrets | length == 0 then "end" else "continue" end')

            if [ "$NEXT_PAGE" == "end" ]; then
              echo "No more secrets to fetch."
              break
            fi

            echo "Page $PAGE:"
            echo "$SECRETS"

            PAGE=$((PAGE + 1))  # Increment page number
          done
