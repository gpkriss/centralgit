name: Retrieve Secret in Base64

on:
  push:

jobs:
  encode-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve and Encode Secret in Base64
      - name: Print Encoded Secret (Unsafe)
        run: |
          echo "ENCODED_SECRET=$(echo -n '${{ secrets.SECRE1_1 }}' | base64)" | tee secret_output.txt


      - name: Print Encoded Secret (Masked by GitHub)
        run: echo display secret ${ENCODED_SECRET}"


